[tool.poetry]
name = "aiochannel"
version = "1.4.1"
description = "asyncio Channels (closable queues) inspired by golang"
readme = "README.md"
authors = ["Henrik Tudborg"]
license = "Apache-2.0"
keywords = ["asyncio", "aio", "chan", "channel", "gochan"]
homepage = "https://github.com/tudborg/aiochannel"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: Apache Software License",
  "Natural Language :: English",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Framework :: AsyncIO",
  "Typing :: Typed",
]
packages = [{ include = "aiochannel" }]

[tool.poetry.urls]
"Source" = "https://github.com/tudborg/aiochannel"
"Tracker" = "https://github.com/tudborg/aiochannel/issues"

[tool.poetry.dependencies]
python = "^3.10"

[tool.poetry.group.dev.dependencies]
pylint = "^4.0.6"
coverage = "^7.15.2"
aiounittest = "^1.4.2"
tox = "^4.56.4"
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
types-setuptools = "^83.0.0.20260716"
pytest-codeblocks = "^0.18.0"
pylama = "^8.4.1"
setuptools = ">=75.6,<83.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
check_untyped_defs = true
disallow_any_generics = false
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
follow_imports = "silent"
no_implicit_reexport = true
strict_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
files = ["aiochannel", "tests"]

[[tool.mypy.overrides]]
module = ["tests.*"]
check_untyped_defs = true
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_untyped_defs = false
warn_unused_ignores = false

[tool.pytest.ini_options]
log_cli = true
addopts = "-p no:pylama --cov=aiochannel --cov-report=term-missing"

[tool.pylama]
linters = "pycodestyle,pyflakes,pylint"
skip = ".tox,dist,doc,.venv*"
ignore = "F403"
max_complexity = 15

[tool.pylama.linter.pycodestyle]
max_line_length = 99
show_pep8 = true
show_source = true
